brands = [ "KgPerMmCubed", "TonPerMCubed", "KgPerMCubed" ]
units = "Brands are KgPerMmCubed and metric-tonne-per-cubic-meter TonPerMCubed as edge/display units, with KgPerMCubed as the canonical arithmetic unit."
factors = [
