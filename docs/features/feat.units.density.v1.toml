# Edge cases
# Zero and negative densities are accepted. A conversion round trip can incur ordinary
# Float rounding and is not promised to reproduce a bit-identical Float.
#
# Assumption set
# Each conversion is a linear scale with no offset. TonPerMCubed means metric tonnes per
# cubic meter. Noncanonical values must cross through KgPerMCubed before arithmetic.
#
# Exact failure semantics
# The API exposes no Result-returning branch or explicit panic path. Inputs are neither
# rejected nor repaired, so any exceptional Float behavior flows into the returned brand.
