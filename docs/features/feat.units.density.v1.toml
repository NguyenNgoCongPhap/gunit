name = "Density brands and conversions"
status = "completed"
intensity = "calc"
intent = "Separates supported mass-density representations and provides explicit conversion and arithmetic through kilograms per cubic meter."
consequence_of_change = "A silent factor or canonical-unit change can misstate material mass by orders of magnitude and corrupt every load or inertia calculation built from density."
acceptance = [
  "KgPerMmCubed, TonPerMCubed, and KgPerMCubed remain distinct opaque brands with direct constructors and raw-value extractors.",
  "Each noncanonical-to-KgPerMCubed conversion multiplies by its cited factor, and each inverse conversion divides by the same factor.",
  "Add, subtract, and scale accept the canonical KgPerMCubed brand and return KgPerMCubed.",
  "A conversion between the two noncanonical brands requires an explicit path through KgPerMCubed.",
]
non_goals = [
  "Providing material reference densities or selecting a density from a material name.",
  "Validating sign, magnitude, finiteness, or physical plausibility.",
  "Providing direct noncanonical conversion, volume conversion, or mass-from-volume calculation.",
]
