schema_version = 1
id = "feat.units.area.v1"
name = "Area brands and conversions"
status = "completed"
intensity = "calc"
intent = "Keeps square-millimeter, square-centimeter, and square-meter values distinct while routing conversion and arithmetic through SquareMeter."
consequence_of_change = "A silent factor or canonical-unit change can scale section areas incorrectly and invalidate downstream geometry, load, and design calculations."
acceptance = [
  "SquareMillimeter, SquareCentimeter, and SquareMeter remain distinct opaque brands with direct constructors and raw-value extractors.",
  "Each noncanonical-to-SquareMeter conversion multiplies by its cited factor, and each inverse conversion divides by the same factor.",
  "Add, subtract, and scale accept the canonical SquareMeter brand and return SquareMeter.",
  "A conversion between the two noncanonical brands requires an explicit path through SquareMeter.",
]
non_goals = [
  "Deriving area by multiplying length brands or taking square roots back to length.",
  "Validating sign, magnitude, finiteness, or physical plausibility.",
  "Providing direct SquareMillimeter-to-SquareCentimeter conversion or noncanonical arithmetic.",
]
failure = "No explicit failure path exists: construction, extraction, conversion, and arithmetic return directly without validation, clamping, or normalization; Float rounding and non-finite behavior are inherited from the underlying Float operations."
brands = [ "SquareMillimeter", "SquareCentimeter", "SquareMeter" ]
units = "Brands are SquareMillimeter and SquareCentimeter as edge/display units and SquareMeter as the canonical arithmetic unit; values are not normalized at construction."
factors = [
  "1 square millimeter = 0.000001 square meter (src/gunit/area.gleam:17)",
  "1 square centimeter = 0.0001 square meter (src/gunit/area.gleam:19)",
]
golden_tests = [
  "square_millimeter_forward_test (test/gunit_test.gleam)",
  "square_millimeter_inverse_test (test/gunit_test.gleam)",
  "square_centimeter_forward_test (test/gunit_test.gleam)",
  "square_centimeter_inverse_test (test/gunit_test.gleam)",
]
provenance = "The source states that both factors are the squares of the matching length factors (src/gunit/area.gleam:9, src/gunit/area.gleam:10)."

# Edge cases
# Zero and negative areas are accepted. A conversion round trip can incur ordinary Float
# rounding and is not promised to reproduce a bit-identical Float.
#
# Assumption set
# Each conversion is a linear scale with no offset. Noncanonical brands cross through
# SquareMeter, and arithmetic is available only after values share that canonical brand.
#
# Exact failure semantics
# The API exposes no Result-returning branch or explicit panic path. Inputs are neither
# rejected nor repaired, so any exceptional Float behavior flows into the returned brand.
