schema_version = 1
id = "feat.units.time.v1"
name = "Time brands and conversions"
status = "completed"
intensity = "calc"
intent = "Separates second, millisecond, minute, hour and day durations while providing explicit conversion and Second-only arithmetic."
consequence_of_change = "A silent factor, brand, or canonical-unit change can rescale durations and corrupt dynamic, integration, timeout, or sampling calculations."
acceptance = [
  "Second, Millisecond, Minute, Hour and Day remain distinct opaque brands with direct constructors and raw-value extractors.",
  "Minute, Hour and Day convert to Second by multiplying by their cited factor and back by dividing; Millisecond converts to Second by dividing by its factor (1000) and back by multiplying, so every whole millisecond count lands on the nearest Float of its seconds.",
  "Add, subtract, and scale accept the canonical Second brand and return Second.",
  "No operation implicitly coerces another time brand to Second.",
]
non_goals = [
  "Providing clocks, dates, calendars, scheduling, or timeout side effects.",
  "Validating sign, magnitude, finiteness, or physical plausibility.",
  "Providing arithmetic directly on Millisecond values or converting frequency to period.",
]
failure = "No explicit failure path exists: construction, extraction, conversion, and arithmetic return directly without validation, clamping, or normalization; Float rounding and non-finite behavior are inherited from the underlying Float operations."
brands = [ "Second", "Millisecond", "Minute", "Hour", "Day" ]
units = "Brands are Second, the canonical arithmetic unit, and Millisecond, Minute, Hour and Day, edge/display units (a Day is exactly 86 400 s, never a calendar day); each constructor stores the raw Float in the named brand."
factors = [
  "1 second = 1000.0 millisecond; seconds are milliseconds divided by it (src/gunit/time.gleam:15)",
  "1 minute = 60.0 second (src/gunit/time.gleam:19)",
  "1 hour = 3600.0 second (src/gunit/time.gleam:21)",
  "1 day = 86_400.0 second (src/gunit/time.gleam:23)",
]
golden_tests = [
  "millisecond_forward_test (test/gunit_test.gleam)",
  "millisecond_inverse_test (test/gunit_test.gleam)",
  "millisecond_whole_count_is_exact_test (test/gunit_test.gleam)",
  "minute_forward_test (test/gunit_test.gleam)",
  "minute_inverse_test (test/gunit_test.gleam)",
  "hour_forward_test (test/gunit_test.gleam)",
  "hour_inverse_test (test/gunit_test.gleam)",
  "day_forward_test (test/gunit_test.gleam)",
  "day_inverse_test (test/gunit_test.gleam)",
]
provenance = "The millisecond factor is the SI prefix milli (src/gunit/time.gleam:15); minute, hour and day are the non-SI units accepted for use with the SI, BIPM SI Brochure (9th edition) Table 8."

# Edge cases
# Zero and negative durations are accepted. A conversion round trip can incur ordinary
# Float rounding and is not promised to reproduce a bit-identical Float.
#
# Assumption set
# Conversion is linear with no offset. Millisecond values cross to Second by
# division and cross back by multiplication; Minute, Hour and Day cross to Second
# by multiplication and back by division; arithmetic exists only for Second.
#
# Exact failure semantics
# The API exposes no Result-returning branch or explicit panic path. Inputs are neither
# rejected nor repaired, so any exceptional Float behavior flows into the returned brand.
