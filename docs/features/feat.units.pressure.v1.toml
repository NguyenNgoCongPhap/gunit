# Edge cases
# Zero and negative pressures or stresses are accepted. A conversion round trip can incur
# ordinary Float rounding and is not promised to reproduce a bit-identical Float.
#
# Assumption set
# Each conversion is a linear scale with no offset. Pressure and stress intentionally
# share brands. Noncanonical values cross through Pascal before canonical arithmetic.
#
# Exact failure semantics
# The API exposes no Result-returning branch or explicit panic path. Inputs are neither
# rejected nor repaired, so any exceptional Float behavior flows into the returned brand.
