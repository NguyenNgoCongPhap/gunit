  "Pascal, Kilopascal, Megapascal, Gigapascal, and KgfPerCm2 remain distinct opaque brands with direct constructors and raw-value extractors.",
  "Each noncanonical-to-Pascal conversion multiplies by its cited factor, and each inverse conversion divides by the same factor.",
  "Add, subtract, and scale accept the canonical Pascal brand and return Pascal.",
  "A conversion between two noncanonical brands requires an explicit path through Pascal.",
]
non_goals = [
  "Distinguishing pressure from stress beyond their shared unit brands.",
