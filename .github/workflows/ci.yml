name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
      # The catalog is authoritative for what each family promises, so an invented factor
      # or a dead test citation is a defect even though nothing fails to compile.
      - run: python3 scripts/verify_catalog.py
